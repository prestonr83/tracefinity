name: Fork Image

# Builds this fork's container image for the cluster described in deploy/.
# Kept apart from the upstream docker-*.yml workflows so that syncing the
# fork with upstream never conflicts; the upstream dev build is disabled in
# this repository's Actions settings instead of being edited.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main: a moving `main` tag plus an immutable `sha-<short>` tag.
      # v* tags: the version and major.minor as well.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # shown in the app's settings popover, so a deployment can be checked
      - name: Choose APP_VERSION
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # amd64 only: the target node is amd64 and an emulated arm64 build
      # of the OpenCV/ONNX image takes most of an hour
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the pinned image reference
        run: |
          {
            echo "### Image"
            echo
            echo 'Pin this in deploy/tracefinity/values.yaml:'
            echo
            echo '```'
            echo "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
